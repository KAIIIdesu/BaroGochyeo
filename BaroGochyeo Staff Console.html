<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BaroGochyeo Staff Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: staff console. A fixed rail (top bar on phones) beside one working column; summary first, detail on demand.
   Palette and type come from the BaroGochyeo citizen app: forest, sage, blue, coral, mustard on ivory. Flat colour, resting edges, no gradients. */
:root{
  --bg:#F5F2EA; --bg-2:#ECE8DC; --paper:#FCFBF7; --ink:#26332F; --ink-2:#55635E; --ink-3:#7A8681;
  --forest:#24564B; --forest-dk:#183A32; --on-forest:#FCFBF7; --sage:#91B6A4; --sage-pale:#DCE8E1;
  --blue:#668AA0; --coral:#E4775B; --mustard:#D6A642; --mustard-dk:#A87E27;
  --line:rgba(24,58,50,.10); --line-2:rgba(24,58,50,.18); --rest:0 3px 0 rgba(24,58,50,.07); --press:0 3px 0 var(--forest-dk);
  --high-tint:#F8E2DA; --high-ink:#9A3F28; --med-tint:#F6EBD0; --med-ink:#76581A; --low-tint:#E1EAEF; --low-ink:#3F5F72; --ok-tint:#DCE8E1; --ok-ink:#24564B; --muted-tint:#E7EAE8; --muted-ink:#46534E;
  --sample:#F6EBD0; --sample-ink:#76581A;
  --f-display:"Nunito","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-body:"Nunito","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --f-brand:"Jua","Nunito",sans-serif;
  --r-sm:12px; --r-md:16px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13231F; --bg-2:#1A2F29; --paper:#1F3631; --ink:#F5F2EA; --ink-2:#B7C2BC; --ink-3:#8C9993; --forest:#2C6557; --forest-dk:#0E1F1B; --sage-pale:#2A443B;
  --line:rgba(245,242,234,.09); --line-2:rgba(245,242,234,.17); --rest:0 3px 0 rgba(0,0,0,.2);
  --high-tint:#3A2B24; --high-ink:#F2A58F; --med-tint:#36301F; --med-ink:#EDC57F; --low-tint:#22343A; --low-ink:#A9C4D2; --ok-tint:#22392F; --ok-ink:#A9D3BF; --muted-tint:#2A3A35; --muted-ink:#C3CBC6;
  --sample:#36301F; --sample-ink:#EDC57F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13231F; --bg-2:#1A2F29; --paper:#1F3631; --ink:#F5F2EA; --ink-2:#B7C2BC; --ink-3:#8C9993; --forest:#2C6557; --forest-dk:#0E1F1B; --sage-pale:#2A443B;
  --line:rgba(245,242,234,.09); --line-2:rgba(245,242,234,.17); --rest:0 3px 0 rgba(0,0,0,.2);
  --high-tint:#3A2B24; --high-ink:#F2A58F; --med-tint:#36301F; --med-ink:#EDC57F; --low-tint:#22343A; --low-ink:#A9C4D2; --ok-tint:#22392F; --ok-ink:#A9D3BF; --muted-tint:#2A3A35; --muted-ink:#C3CBC6;
  --sample:#36301F; --sample-ink:#EDC57F; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-weight:600;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:900;margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:28px}h2{font-size:19px}h3{font-size:15px}
p{margin:0}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:13px}
.label{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--forest-dk);color:#FCFBF7;padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:42px;height:auto}
.wordmark{font-family:var(--f-brand);font-size:24px;line-height:1;color:#FCFBF7}
.brand small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sage);margin-top:3px}
.nav{display:grid;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:var(--r-sm);color:#D8E4DD;text-decoration:none;font-weight:800}
.nav a:hover{background:rgba(252,251,247,.07)}
.nav a[aria-current="page"]{background:#FCFBF7;color:#183A32}
.nav a .count{margin-left:auto;font-size:12px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--mustard);color:#183A32}
.nav svg{width:20px;height:20px;flex:none}
.rail-foot{margin-top:auto;font-size:12px;color:#B7C9C0;line-height:1.45;padding:0 6px}
.rail-foot b{color:#FCFBF7;display:block}
main{min-width:0;padding-block:22px 48px;padding-inline:clamp(16px,3vw,36px)}
.sample-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:var(--r-md);background:var(--sample);color:var(--sample-ink);font-size:13px;margin-bottom:20px}
.sample-bar b{font-weight:900;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.sample-bar button{margin-left:auto;border:0;background:transparent;color:inherit;font-weight:900;text-decoration:underline;min-height:36px;padding:0 4px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:18px}
.page-head p{color:var(--ink-2)}

/* ---------- Surfaces ---------- */
.panel{background:var(--paper);border-radius:var(--r-lg);box-shadow:inset 0 0 0 2px var(--line),var(--rest);padding:18px 20px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.link{border:0;background:none;color:var(--forest);font-weight:900;font-size:14px;text-decoration:none;min-height:36px;display:inline-flex;align-items:center;gap:4px;padding:0}
:root[data-theme="dark"] .link{color:var(--sage)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .link{color:var(--sage)}}

/* ---------- Overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{border:0;text-align:left;min-width:0;background:var(--paper);border-radius:var(--r-lg);box-shadow:inset 0 0 0 2px var(--line),var(--rest);padding:14px 16px 12px;display:grid;gap:2px;transition:transform .12s ease,box-shadow .12s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--line-2),0 5px 0 rgba(24,58,50,.1)}
.kpi:active{transform:translateY(1px)}
.kpi .k{font-size:13px;font-weight:800;color:var(--ink-2);display:flex;align-items:flex-start;gap:7px;line-height:1.3;min-height:2.6em}
.kpi .k i{margin-top:4px}
.kpi .k i{width:10px;height:10px;border-radius:50%;flex:none}
.kpi b{font-family:var(--f-display);font-size:34px;font-weight:900;line-height:1.1}
.kpi small{font-size:12px;color:var(--ink-3);font-weight:700}
.kpi.flash b{animation:flash .9s ease}
@keyframes flash{30%{color:var(--mustard-dk);transform:scale(1.08)}}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
.ov-secondary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.section-title{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:10px}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;margin-left:6px;border-radius:999px;background:var(--mustard);color:#183A32;font-size:13px;vertical-align:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.link.inline{min-height:0;font-size:13px}
.mission h3{color:var(--on-forest);font-size:17px}
.stackcol{display:grid;gap:16px;min-width:0}

.mission{background:var(--forest);color:var(--on-forest);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--press);display:grid;gap:10px}
.mission .label{color:var(--sage-pale)}
:root[data-theme="dark"] .mission .label{color:var(--sage)}
.mission-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill-time{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:var(--mustard);color:#183A32;white-space:nowrap}
.mission-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mission-main b{font-family:var(--f-display);font-size:52px;font-weight:900;line-height:1}
.mission-main span{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--sage)}
.mission-msg{font-family:var(--f-display);font-weight:900;font-size:17px;color:var(--mustard)}
.meter{height:12px;border-radius:10px;background:rgba(252,251,247,.18);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mustard);border-radius:10px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.mission-hoods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.mission-hoods div{background:rgba(252,251,247,.1);border-radius:12px;padding:8px 10px;min-width:0}
.mission-hoods small{display:block;font-size:12px;color:var(--sage-pale);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission-hoods b{font-family:var(--f-display);font-size:20px;font-weight:900}
.mission-note{font-size:12px;color:var(--sage-pale)}

.queue{display:grid;gap:8px}
.q-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--bg);text-decoration:none;color:inherit}
.q-row .t{min-width:0}
.q-row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-row .t small{display:block;font-size:12px;color:var(--ink-2)}
.q-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:18px 8px;color:var(--ink-2)}
.empty img{width:72px}

.mix{display:flex;height:16px;border-radius:10px;overflow:hidden;gap:3px;margin:6px 0 12px}
.mix i{display:block;min-width:6px;transition:flex-grow .6s ease}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 12px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.legend li i{width:10px;height:10px;border-radius:3px;flex:none}
.legend li b{margin-left:auto;color:var(--ink);font-family:var(--f-display);font-size:16px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:120px;margin-top:6px}
.bars div{display:grid;gap:4px;justify-items:center;align-self:end}
.bars span{width:100%;max-width:34px;background:var(--sage);border-radius:6px 6px 3px 3px;min-height:4px;transition:height .5s ease}
.bars span.today{background:var(--forest)}
.bars small{font-size:11px;color:var(--ink-3);font-weight:800}
.bars em{font-style:normal;font-size:12px;font-weight:900;color:var(--ink-2)}
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-top:2px dashed var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed li i{width:8px;height:8px;border-radius:50%;background:var(--sage);transform:translateY(-1px)}
.feed time{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* ---------- Chips + buttons ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:900;background:var(--muted-tint);color:var(--muted-ink)}
.chip.high{background:var(--high-tint);color:var(--high-ink)} .chip.medium{background:var(--med-tint);color:var(--med-ink)} .chip.low{background:var(--low-tint);color:var(--low-ink)}
.chip.pending{background:var(--med-tint);color:var(--med-ink)} .chip.accepted{background:var(--ok-tint);color:var(--ok-ink)} .chip.duplicate,.chip.invalid{background:var(--high-tint);color:var(--high-ink)}
.chip.st-pending{background:var(--med-tint);color:var(--med-ink)} .chip.st-accepted{background:var(--low-tint);color:var(--low-ink)} .chip.st-repairing{background:var(--ok-tint);color:var(--ok-ink)}
.chip.st-completed{background:var(--forest);color:var(--on-forest)} .chip.st-rejected{background:var(--high-tint);color:var(--high-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:var(--r-sm);font-weight:900;font-size:14px;background:var(--forest);color:var(--on-forest);box-shadow:var(--press);transition:transform .12s ease,box-shadow .12s ease;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--forest-dk)}
.btn.soft{background:var(--paper);color:var(--forest);box-shadow:inset 0 0 0 2px var(--line-2),0 3px 0 rgba(24,58,50,.1)}
:root[data-theme="dark"] .btn.soft{color:var(--sage)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.soft{color:var(--sage)}}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- Reports list ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;min-height:42px;border:0;border-radius:var(--r-sm);padding:0 14px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line-2)}
.search:focus{outline:none;box-shadow:inset 0 0 0 2px var(--forest)}
select.sel{min-height:42px;border:0;border-radius:var(--r-sm);padding:0 12px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line-2);font-weight:800}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.filters button{flex:none;border:0;min-height:38px;padding:0 12px;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line-2);font-weight:800;font-size:13px;color:var(--ink-2)}
.filters button b{margin-left:4px;font-weight:900;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--forest);color:var(--on-forest);box-shadow:none}
.filters button[aria-pressed="true"] b{color:var(--mustard)}
.filters .sep{flex:none;width:2px;margin:6px 2px;background:var(--line-2);border-radius:2px}
.table-wrap{overflow-x:auto;border-radius:var(--r-lg);background:var(--paper);box-shadow:inset 0 0 0 2px var(--line),var(--rest)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:12px 14px;border-bottom:2px solid var(--line)}
td{padding:11px 14px;border-bottom:2px dashed var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background-color .12s ease}
td.act{text-align:right;width:1%;white-space:nowrap}
.btn.view{min-width:64px}
tbody tr:hover{background:var(--bg)}
td .ttl{display:block;font-weight:800;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td .id{font-size:12px;color:var(--ink-3);font-weight:800}
.stripe{width:6px;padding:0!important}
.stripe i{display:block;width:4px;height:34px;border-radius:4px;margin-left:8px}
.cards{display:none}

/* ---------- Detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;font-weight:900;color:var(--ink-2);text-decoration:none;margin-bottom:4px}
.detail-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:8px}
.d-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
.photo{position:relative;border-radius:var(--r-md);overflow:hidden;background:#26332F;aspect-ratio:4/3;max-width:100%}
.photo svg{display:block;width:100%;height:100%}
.photo .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(24,58,50,.82);color:#FCFBF7}
.photo .pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:4px solid #FCFBF7;background:var(--coral);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.facts{display:grid;margin:0}
.facts div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:9px 0;border-top:2px dashed var(--line)}
.facts div:first-child{border-top:0}
.facts dt{color:var(--ink-2);font-size:13px;font-weight:800}
.facts dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{border:0;min-height:42px;border-radius:var(--r-sm);background:var(--paper);box-shadow:inset 0 0 0 2px var(--line-2),0 2px 0 rgba(24,58,50,.08);font-weight:900;font-size:13px;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--on-forest);box-shadow:0 3px 0 var(--forest-dk)}
.seg button[aria-pressed="true"].warn{background:var(--coral);color:#26332F;box-shadow:0 3px 0 var(--high-ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.action-group{display:grid;gap:8px;padding:12px 0;border-top:2px dashed var(--line)}
.action-group:first-of-type{border-top:0;padding-top:0}
.hint{font-size:12px;color:var(--ink-3)}
textarea{width:100%;min-height:76px;border:0;border-radius:var(--r-sm);padding:10px 12px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line-2);resize:vertical}
textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--forest)}
.history{list-style:none;margin:0;padding:0}
.history li{position:relative;padding:0 0 12px 22px;font-size:13px}
.history li::before{content:"";position:absolute;left:4px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--sage)}
.history li::after{content:"";position:absolute;left:7px;top:17px;bottom:0;width:2px;background:var(--line-2)}
.history li:last-child::after{display:none}
.history time{display:block;font-size:12px;color:var(--ink-3)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100% - 32px));padding:10px 10px 10px 16px;border-radius:var(--r-md);background:#26332F;color:#F5F2EA;font-weight:800;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:all .22s ease;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:var(--mustard);color:#183A32;font-weight:900;border-radius:10px;min-height:34px;padding:0 12px;flex:none}


/* ---------- App Content ---------- */
.sync-note{display:flex;flex-wrap:wrap;gap:4px 10px;padding:10px 14px;border-radius:var(--r-md);background:var(--bg-2);color:var(--ink-2);font-size:13px;margin-bottom:16px}
.sync-note b{color:var(--ink);font-weight:900}
.content-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.preview-col{position:sticky;top:16px}
.sel.sm{min-height:38px;max-width:60%;font-size:13px}
.sample-chip{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sample);color:var(--sample-ink);white-space:nowrap}
form{display:grid;gap:12px}
.fld{display:grid;gap:5px;border:0;margin:0;padding:0;min-width:0}
.fld label,.fld legend{font-size:13px;font-weight:900;color:var(--ink);padding:0}
.fld legend{margin-bottom:5px}
.fld input,.fld-row input{width:100%;min-height:42px;border:0;border-radius:var(--r-sm);padding:0 12px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line-2);font-weight:700}
.fld input:focus,.fld textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--forest)}
.fld input:disabled{opacity:.55;cursor:not-allowed}
.fld.bad input,.fld.bad textarea{box-shadow:inset 0 0 0 2px var(--coral);background:var(--high-tint)}
.fld textarea{min-height:84px}
.fld-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{font-size:12px;font-weight:900;color:var(--high-ink)}
.err::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;margin-right:6px;border-radius:50%;background:var(--coral);color:#26332F;font-size:11px}
.hint.counts{background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink-2);margin-top:6px}
.hint.counts b{color:var(--ink)}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lock{font-size:11px;font-weight:900;padding:1px 7px;border-radius:999px;background:var(--muted-tint);color:var(--muted-ink);margin-left:4px}
.lock-note{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;background:var(--med-tint);color:var(--ink);margin-bottom:12px}
.lock-note .link{min-height:32px;font-size:13px}
.form-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.dirty{font-size:12px;font-weight:900;color:var(--med-ink);background:var(--med-tint);padding:3px 9px;border-radius:999px}
/* Citizen phone preview: the citizen app's own look, scaled down. */
.phone{display:grid;gap:10px;padding:14px;border-radius:26px;background:#F5F2EA;color:#26332F;box-shadow:inset 0 0 0 6px #26332F;max-width:340px;margin:0 auto;padding:18px}
.phone-top{display:flex;align-items:center;gap:8px}.phone-top img{width:30px}.phone-top .chip{margin-left:auto;background:#ECE8DC;color:#183A32}
.wordmark-sm{font-family:var(--f-brand);font-size:20px;color:#24564B}
.c-hero{display:grid;gap:3px;background:#ECE8DC;border-radius:18px;padding:12px 14px}
.c-hero b{font-family:var(--f-display);font-size:17px;font-weight:900}.c-hero span{font-size:12px;color:#55635E}
.c-btn{justify-self:start;margin-top:6px;background:#24564B;color:#FCFBF7!important;font-weight:900;font-size:12px!important;padding:6px 12px;border-radius:10px;box-shadow:0 3px 0 #183A32}
.c-mission{display:grid;gap:4px;background:#24564B;color:#FCFBF7;border-radius:20px;padding:14px;box-shadow:0 4px 0 #183A32}
.c-mission.paused{opacity:.55;filter:grayscale(.5)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c-kicker{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#DCE8E1}
.c-pill{font-size:10px;font-weight:900;padding:3px 8px;border-radius:999px;background:#D6A642;color:#183A32;white-space:nowrap}
.c-title{font-family:var(--f-display);font-size:16px;font-weight:900;overflow-wrap:anywhere}
.c-desc{font-size:12px;color:#DCE8E1;overflow-wrap:anywhere}
.c-count{display:flex;align-items:baseline;gap:6px;margin-top:2px}.c-count strong{font-family:var(--f-display);font-size:36px;font-weight:900;line-height:1}.c-count span{font-size:13px;font-weight:800;color:#91B6A4}
.c-meter{height:9px;border-radius:9px;background:rgba(252,251,247,.2);overflow:hidden}.c-meter i{display:block;height:100%;background:#D6A642;border-radius:9px}
.c-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;font-size:12px;font-weight:900;color:#D6A642;margin-top:2px}
.c-bonus{color:#FCFBF7;background:rgba(252,251,247,.14);padding:2px 8px;border-radius:999px}
.c-paused-note{font-size:11px;font-weight:800;color:#FCFBF7}
.c-ann{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:#F6EBD0;color:#26332F;box-shadow:inset 0 0 0 2px rgba(168,126,39,.3)}
.c-ann-icon{flex:none;width:30px;height:30px;border-radius:10px;background:#D6A642;color:#183A32;display:grid;place-items:center}.c-ann-icon svg{width:18px;height:18px}
.c-ann>span:last-child{display:grid;gap:2px;min-width:0}.c-ann b{font-size:14px;font-weight:900;overflow-wrap:anywhere}.c-ann span span{font-size:12px;color:#55635E;overflow-wrap:anywhere}
.c-empty{font-size:12px;font-weight:800;color:#7A8681;text-align:center;padding:12px;border-radius:14px;border:2px dashed #D8D3C5}
@media (max-width:1100px){.content-grid{grid-template-columns:minmax(0,1fr)}.preview-col{position:static}}
@media (max-width:520px){.fld-row{grid-template-columns:minmax(0,1fr)}.panel-head{flex-wrap:wrap}.sel.sm{max-width:100%;width:100%}}

/* ---------- Narrow screens ---------- */
@media (max-width:1180px){.ov-secondary{grid-template-columns:repeat(2,minmax(0,1fr))}.ov-secondary>:last-child{grid-column:1/-1}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.ov-grid,.d-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;z-index:10}
  .brand img{width:32px}.wordmark{font-size:20px}.brand small{display:none}
  .nav{display:flex;margin-left:auto}.nav a{min-height:40px;padding:0 10px;font-size:14px}.nav a svg{display:none}
  .rail-foot{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:28px}
  h1{font-size:24px}
  .table-wrap{display:none}
  .cards{display:grid;gap:8px}
  .card-row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
  .card-row .bar{align-self:stretch}
  .card-row .body{min-width:0}
  .ov-secondary{grid-template-columns:minmax(0,1fr)}
  .q-row{grid-template-columns:minmax(0,1fr);gap:8px}
  .q-actions{justify-content:flex-start}
  .card-row .bar{border-radius:4px}
  .card-row b{display:block;overflow-wrap:anywhere}
  .card-row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .facts div{grid-template-columns:minmax(0,1fr);gap:2px}
  .mission-main b{font-size:44px}
}
@media (max-width:420px){.nav{gap:2px}.nav a{padding:0 7px;font-size:12.5px}.brand .wordmark{display:none}.seg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

let S;
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY) || "null"); if(s && Array.isArray(s.reports)) return s; }catch{} return {reports: seed()}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch{} }
S = load();

/* ---------- One categorisation for cards, filters and the status bar ----------
   Every report sits in exactly one stage, so the five counts always add up to the total. */
const STAGES = [
  {key:"pending",   label:"Pending review",        note:"Waiting for a decision",  color:"var(--mustard)"},
  {key:"accepted",  label:"Accepted · Not started", note:"Repair not scheduled yet", color:"var(--blue)"},
  {key:"repairing", label:"In repair",              note:"Scheduled or in progress", color:"var(--sage)"},
  {key:"completed", label:"Completed",              note:"Repaired by the district", color:"var(--forest)"},
  {key:"rejected",  label:"Duplicate or invalid",   note:"No citizen reward",        color:"var(--coral)"},
];
function stage(r){
  if(r.review==="pending") return "pending";
  if(r.review!=="accepted") return "rejected";
  if(r.repair==="completed") return "completed";
  if(r.repair==="scheduled" || r.repair==="in_progress") return "repairing";
  return "accepted";
}
function stageCounts(){ const c = Object.fromEntries(STAGES.map(s => [s.key, 0])); S.reports.forEach(r => c[stage(r)]++); return c; }

/* Weekly verification target: reports first accepted this week that are still valid (not duplicate or invalid).
   Derived from the records every time, so repair changes never add credit and Undo restores it exactly. */
const countsForTarget = r => r.firstAcceptedAt != null && r.firstAcceptedAt >= weekStart() && r.review !== "duplicate" && r.review !== "invalid" && r.review !== "pending";
const targetReports = () => S.reports.filter(countsForTarget);
function targetHoods(){ const m = {}; targetReports().forEach(r => m[r.hood] = (m[r.hood]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { const m = Math.round((Date.now()-t)/6e4); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };
const stamp = t => new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:"Asia/Seoul"});
const risk = r => r.staffRisk || r.aiRisk;
const riskChip = r => r.staffRisk ? `<span class="chip ${r.staffRisk}" title="Staff rating">Staff · ${RISK[r.staffRisk]}</span>`
  : r.aiRisk ? `<span class="chip ${r.aiRisk}" title="AI assessment, not yet reviewed by staff">AI · ${RISK[r.aiRisk]}</span>` : `<span class="chip">Not assessed</span>`;
const stageInfo = r => STAGES.find(s => s.key===stage(r));
const stageChip = r => { const s = stage(r); const label = s==="rejected" ? REVIEW[r.review] : s==="repairing" ? `In repair · ${REPAIR[r.repair].toLowerCase()}` : stageInfo(r).label; return `<span class="chip st-${s}">${label}</span>`; };
const hrefOf = r => "#" + r.id.replace("BG-","r");
function leftText(){ const ms = weekStart()+7*DAY-Date.now(), d = Math.floor(ms/DAY), h = Math.floor(ms%DAY/36e5); return d ? `${d}d ${h}h left` : `${h}h left`; }
const weekLabel = () => new Date(weekStart()+9*36e5).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});

/* ---------- State changes ---------- */
let undo = null, toastTimer;
function toast(msg, undoFn){
  $("#toastMsg").textContent = msg; undo = undoFn || null; $("#toastUndo").hidden = !undo; $("#toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").classList.remove("on"), undoFn ? 7000 : 3200);
}
$("#toastUndo").onclick = () => { if(undo){ const f = undo; undo = null; f(); } $("#toast").classList.remove("on"); };
let flashKeys = [];
function change(id, patch, label){
  const r = S.reports.find(x => x.id===id); if(!r) return;
  const before = JSON.parse(JSON.stringify(r)), was = stageCounts(), wasTarget = targetReports().length;
  Object.assign(r, patch);
  if(patch.review){
    if(patch.review==="accepted"){ if(r.firstAcceptedAt == null) r.firstAcceptedAt = Date.now(); if(!r.repair) r.repair = "not_started"; }
    else r.repair = null; /* only accepted reports have repair progress */
  }
  r.history.push({at: Date.now(), text: label});
  save();
  const now = stageCounts(), target = targetReports().length;
  flashKeys = Object.keys(now).filter(k => now[k]!==was[k]);
  const move = target - wasTarget;
  toast(`${id}: ${label}.${move>0 ? " Weekly target +1." : move<0 ? " Weekly target −1." : ""}`, () => {
    const cur = S.reports.find(x => x.id===id); Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, before);
    save(); flashKeys = []; render(); toast(`${id}: change undone.`);
  });
  render();
}

  const rk = {high:0,medium:1,low:2};

      ${queue.length ? `<div class="queue">${queue.map(r => `<div class="q-row">${riskChip(r)}<div class="t"><b>${esc(r.title)}</b><small>${r.id} · ${esc(r.hood)} · ${ago(r.createdAt)}</small></div>
        <span class="q-actions"><a class="btn sm" href="${hrefOf(r)}" aria-label="View report ${r.id}">View report</a><button type="button" class="btn sm soft" data-act="accept" data-id="${r.id}" aria-label="Accept ${r.id} without opening">Accept</button></span></div>`).join("")}</div>`
        : `<div class="empty"><img src="${MASCOT}" alt=""><b>Queue is clear</b><span class="small">New citizen reports will appear here.</span></div>`}
    </section>
    <section class="mission" aria-labelledby="wm">
      <div class="mission-top"><span class="label" id="wm">Weekly verification target</span><span class="pill-time">${leftText()}</span></div>
      <h3>Verify ${GOAL} valid reports</h3>

      ${hoods.length ? `<div class="mission-hoods">${hoods.slice(0,3).map(([n,k]) => `<div><small>${esc(n)}</small><b class="num">${k}</b></div>`).join("")}</div>` : ""}

/* ---------- Reports ---------- */
let listState = {filter:"all", q:"", sort:"new"};
const FILTERS = [["all","All reports",()=>true], ...STAGES.map(s => [s.key, s.label, r => stage(r)===s.key]), ["high","High risk",r=>risk(r)==="high"]];
function viewReports(){
  const f = FILTERS.find(x => x[0]===listState.filter) || FILTERS[0], q = listState.q.trim().toLowerCase();
  const list = S.reports.filter(f[2]).filter(r => !q || [r.id,r.title,r.hood,r.place,CAT[r.cat]].join(" ").toLowerCase().includes(q));
  const rk = {high:0,medium:1,low:2};
  list.sort(listState.sort==="old" ? (a,b)=>a.createdAt-b.createdAt : listState.sort==="risk" ? (a,b)=>(rk[risk(a)]??3)-(rk[risk(b)]??3)||b.createdAt-a.createdAt : (a,b)=>b.createdAt-a.createdAt);

  <p class="small muted" style="margin:-4px 0 10px" id="resultCount">Showing ${list.length} of ${S.reports.length}${f[0]!=="all" ? ` · ${f[1]}` : ""}${q ? ` · matching “${esc(listState.q)}”` : ""}</p>

          <div class="seg">${seg("review", r.review, [["pending","Pending"],["accepted","Accept"],["duplicate","Duplicate",1],["invalid","Invalid",1]])}</div>
          <span class="hint">Accepting counts once toward the weekly target. Duplicate or invalid removes it.</span></div>
        <div class="action-group" role="group" aria-labelledby="g2"><span class="label" id="g2">2 · Repair progress</span>
          <div class="seg">${seg("repair", r.repair, Object.entries(REPAIR), !accepted)}</div>
          <span class="hint">${accepted ? "Repair changes never add to the weekly target." : "Only accepted reports have repair progress."}</span></div>
        <div class="action-group" role="group" aria-labelledby="g3"><span class="label" id="g3">Risk rating</span>
          <div class="seg">${seg("risk", r.staffRisk || "ai", [["ai", r.aiRisk ? `AI: ${RISK[r.aiRisk]}` : "AI: none"],["high","Staff: High"],["medium","Staff: Med"],["low","Staff: Low"]])}</div>
          <span class="hint">Choose a staff rating to override the AI assessment.</span></div>
        <div class="action-group"><label class="label" for="note">Internal note</label><textarea id="note" placeholder="Visible to staff only">${esc(r.note)}</textarea><button type="button" class="btn sm soft" data-act="note" data-id="${r.id}" style="justify-self:start">Save note</button></div>
      </section>
      <section class="panel" aria-labelledby="hh"><h2 id="hh" style="margin-bottom:12px">History</h2>
        <ul class="history">${[...r.history].reverse().map(h => `<li>${esc(h.text)}<time>${stamp(h.at)}</time></li>`).join("")}</ul></section>
    </div>
  </div>
  <div class="pager">${prev ? `<a class="btn soft" href="${hrefOf(prev)}">← ${prev.id}</a>` : "<span></span>"}${next ? `<a class="btn soft" href="${hrefOf(next)}">${next.id} →</a>` : ""}</div>`;
}


/* ---------- App Content: citizen weekly mission + Home announcement ----------
   Saved content lives in S.content next to the reports, so Reset restores both. Editing content never
   touches reports, totals or the staff verification target. Nothing here syncs to the citizen app. */
const MISSION_TYPES = {
  submit:  {label:"Submit reports",  unit:"accepted reports", counts:"Counts this citizen's reports that staff accept between the start and end dates. Pending, duplicate and invalid reports don't count."},
  measure: {label:"Measure hazards", unit:"measured hazards", counts:"Counts accepted reports that include a size measurement (AR or on-photo). Photos without a measurement don't count."},
  follow:  {label:"Follow up",       unit:"follow-ups",       counts:"Counts each time the citizen opens one of their reports after its status changes. Once per report."},
};
const isoDay = t => new Date(t + 9*36e5).toISOString().slice(0,10);           /* timestamp → Seoul calendar date */
const dayStart = d => Date.parse(d + "T00:00:00+09:00");
const fmtDay = d => new Date(dayStart(d) + 9*36e5).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
function seedContent(){
  const ws = weekStart();
  return {
    missions: [{id:"m1", title:"Fix-it Week: report 10 hazards", desc:"Help Mapo-gu find hazards before winter. Every accepted report brings the neighborhood closer.",
      type:"submit", target:10, start: isoDay(ws), end: isoDay(ws + 6*DAY), bonus:20, status:"active", participants:38, sampleProgress:0}],
    announcement: {title:"Kerb repairs on Eoulmadang-ro", message:"Mapo-gu is repairing kerbs that citizens reported on Eoulmadang-ro this week. Thank you for your reports!", visible:true},
  };
}
if(!S.content){ S.content = seedContent(); save(); }

/* Citizen progress: Submit reports is derived from accepted reports in the mission dates; the other
   types have no report data in this demo, so they show a fixed sample figure. */
function missionProgress(m){
  if(m.type !== "submit") return m.sampleProgress || 0;
  const a = dayStart(m.start), b = dayStart(m.end) + DAY;
  return S.reports.filter(r => r.review==="accepted" && r.firstAcceptedAt >= a && r.firstAcceptedAt < b).length;
}
const missionLocked = m => (m.participants || 0) > 0;
/* What citizens see: the newest active mission running today. */
function liveMission(){ const today = isoDay(Date.now()); return [...S.content.missions].reverse().find(m => m.status==="active" && m.start <= today && today <= m.end) || null; }
function missionState(m){ const today = isoDay(Date.now()); return m.status==="paused" ? "Paused" : today < m.start ? "Scheduled" : today > m.end ? "Ended" : "Running"; }

let editingId = null, missionDraft = null, annDraft = null, missionErrors = {}, annErrors = {};
const clone = o => JSON.parse(JSON.stringify(o));
function startDrafts(){
  if(!missionDraft && (!editingId || !S.content.missions.some(m => m.id===editingId))) editingId = (liveMission() || S.content.missions.at(-1)).id;
  if(!missionDraft) missionDraft = clone(S.content.missions.find(m => m.id===editingId));
  if(!annDraft) annDraft = clone(S.content.announcement);
}
const savedMission = () => S.content.missions.find(m => m.id===missionDraft?.id) || null;
const normM = m => JSON.stringify({...m, target: String(m.target).trim(), bonus: String(m.bonus).trim()});
const missionDirty = () => { const s = savedMission(); return !s || normM(s) !== normM(missionDraft); };
const annDirty = () => JSON.stringify(S.content.announcement) !== JSON.stringify(annDraft);

function validateMission(m){
  const e = {}, whole = v => /^\d+$/.test(String(v).trim());
  if(!m.title.trim()) e.title = "Enter a mission title."; else if(m.title.trim().length > 60) e.title = "Keep the title under 60 characters.";
  if(!m.desc.trim()) e.desc = "Enter a short description."; else if(m.desc.trim().length > 140) e.desc = "Keep the description under 140 characters.";
  if(!whole(m.target) || Number(m.target) < 1) e.target = "Use a whole number of 1 or more.";
  if(!whole(m.bonus)) e.bonus = "Use a whole number of 0 or more.";
  if(!m.start) e.start = "Choose a start date.";
  if(!m.end) e.end = "Choose an end date."; else if(m.start && m.end <= m.start) e.end = "The end date must be after the start date.";
  return e;
}
function validateAnn(a){
  const e = {};
  if(!a.title.trim()) e.title = "Enter an announcement title."; else if(a.title.trim().length > 60) e.title = "Keep the title under 60 characters.";
  if(!a.message.trim()) e.message = "Enter a short message."; else if(a.message.trim().length > 160) e.message = "Keep the message under 160 characters.";
  return e;
}

/* ---------- Citizen-side previews (sample data) ---------- */
function missionCard(m, {draft = false} = {}){
  if(!m) return `<div class="c-empty">No weekly mission is running right now.</div>`;
  const t = MISSION_TYPES[m.type], target = Math.max(1, Number(m.target) || 1), prog = Math.min(missionProgress(m), target), left = target - prog;
  const paused = m.status === "paused";
  return `<div class="c-mission ${paused ? "paused" : ""}">
    <div class="c-top"><span class="c-kicker">Weekly mission</span><span class="c-pill">${paused ? "Paused" : m.start && m.end ? `${fmtDay(m.start)} – ${fmtDay(m.end)}` : "Dates not set"}</span></div>
    <b class="c-title">${esc(m.title || "Untitled mission")}</b>
    <p class="c-desc">${esc(m.desc || "")}</p>
    <div class="c-count"><strong class="num">${prog}</strong><span>/ ${target} ${t.unit}</span></div>
    <div class="c-meter"><i style="width:${prog/target*100}%"></i></div>
    <div class="c-foot"><span>${left > 0 ? `${left} to go` : "Mission complete"}</span>${Number(m.bonus) > 0 ? `<span class="c-bonus">+${Number(m.bonus)} bonus Contribution Points</span>` : ""}</div>
    ${paused && draft ? `<p class="c-paused-note">Paused missions are hidden from citizens.</p>` : ""}
  </div>`;
}
function announcementCard(a){
  return `<div class="c-ann"><span class="c-ann-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l6 4V6L7 10z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></span>
    <span><b>${esc(a.title || "Untitled announcement")}</b><span>${esc(a.message || "")}</span></span></div>`;
}
/* The citizen Home as it stands with saved content: hidden announcements and paused missions are absent. */
function citizenHome(){
  const a = S.content.announcement, m = liveMission();
  return `<div class="phone" aria-label="Citizen Home preview">
    <div class="phone-top"><img src="${MASCOT}" alt=""><span class="wordmark-sm" lang="ko">바로고쳐</span><span class="chip">Seogyo-dong</span></div>
    ${a.visible ? announcementCard(a) : ""}
    <div class="c-hero"><b>Spot a hazard?</b><span>Point your camera. We handle the report.</span><span class="c-btn">Report a hazard</span></div>
    ${missionCard(m)}
  </div>`;
}

function field(id, label, input, err, hint){
  return `<div class="fld ${err ? "bad" : ""}"><label for="${id}">${label}</label>${input}${err ? `<p class="err" id="${id}-err">${esc(err)}</p>` : hint ? `<p class="hint">${hint}</p>` : ""}</div>`;
}
function viewContent(){
  startDrafts();
  const m = missionDraft, a = annDraft, saved = savedMission(), locked = saved && missionLocked(saved), me = missionErrors, ae = annErrors;
  const lockAttr = locked ? "disabled" : "";
  const dis = (err, id) => err ? `aria-invalid="true" aria-describedby="${id}-err"` : "";
  return `
  <div class="page-head"><div><h1>App Content</h1><p>Edit what citizens see on the Home screen.</p></div></div>
  <div class="sync-note" role="note"><b>Demo only</b> Saved edits update the citizen preview on this page. They are not sent to the separate citizen app.</div>
  <div class="content-grid">
    <div class="stackcol">
      <section class="panel" aria-labelledby="meh">
        <div class="panel-head"><h2 id="meh">Weekly mission</h2>
          <label class="vh" for="mPick">Mission to edit</label>
          <select class="sel sm" id="mPick">${S.content.missions.map(x => `<option value="${x.id}" ${x.id===m.id?"selected":""}>${esc(x.title)} · ${missionState(x)}</option>`).join("")}${!saved ? `<option value="${m.id}" selected>New mission (unsaved)</option>` : ""}</select></div>
        <p class="small muted" style="margin:-4px 0 12px">Citizen-facing mission. Separate from the staff weekly verification target and from Achievement Coins.</p>
        ${locked ? `<div class="lock-note" role="note"><b>${saved.participants} citizens already have progress.</b> You can edit the title and description. Type, target, dates and reward are locked. <button type="button" class="link" data-act="nextMission">Create next mission →</button></div>` : ""}
        <form id="missionForm" novalidate>
          ${field("mTitle", "Mission title", `<input id="mTitle" type="text" maxlength="80" value="${esc(m.title)}" ${dis(me.title,"mTitle")}>`, me.title)}
          ${field("mDesc", "Short description", `<textarea id="mDesc" rows="3" maxlength="200" ${dis(me.desc,"mDesc")}>${esc(m.desc)}</textarea>`, me.desc, `${m.desc.length}/140`)}
          <fieldset class="fld" ${lockAttr}><legend>Mission type${locked ? ' <span class="lock">Locked</span>' : ""}</legend>
            <div class="seg three">${Object.entries(MISSION_TYPES).map(([k,v]) => `<button type="button" data-mtype="${k}" aria-pressed="${m.type===k}" ${lockAttr}>${v.label}</button>`).join("")}</div>
            <p class="hint counts"><b>What counts:</b> ${MISSION_TYPES[m.type].counts}</p></fieldset>
          <div class="fld-row">
            ${field("mTarget", "Target count", `<input id="mTarget" type="number" inputmode="numeric" min="1" step="1" value="${esc(m.target)}" ${lockAttr} ${dis(me.target,"mTarget")}>`, me.target)}
            ${field("mBonus", "Bonus Contribution Points", `<input id="mBonus" type="number" inputmode="numeric" min="0" step="1" value="${esc(m.bonus)}" ${lockAttr} ${dis(me.bonus,"mBonus")}>`, me.bonus, "Given once when a citizen completes it.")}
          </div>
          <div class="fld-row">
            ${field("mStart", "Start date", `<input id="mStart" type="date" value="${esc(m.start)}" ${lockAttr} ${dis(me.start,"mStart")}>`, me.start)}
            ${field("mEnd", "End date", `<input id="mEnd" type="date" value="${esc(m.end)}" ${lockAttr} ${dis(me.end,"mEnd")}>`, me.end)}
          </div>
          <fieldset class="fld"><legend>Status</legend><div class="seg two">
            <button type="button" data-mstatus="active" aria-pressed="${m.status==="active"}">Active</button><button type="button" data-mstatus="paused" aria-pressed="${m.status==="paused"}">Paused</button></div></fieldset>
          <div class="form-actions"><button type="submit" class="btn" id="mSave">Save mission</button><button type="button" class="btn soft" id="mCancel">Cancel</button>
            <span class="dirty" id="mDirty" ${missionDirty() ? "" : "hidden"}>Unsaved changes</span>
            ${!locked && saved ? `<button type="button" class="link" data-act="nextMission" style="margin-left:auto">Create next mission</button>` : ""}</div>
        </form>
      </section>
      <section class="panel" aria-labelledby="aeh">
        <div class="panel-head"><h2 id="aeh">Home announcement</h2></div>
        <form id="annForm" novalidate>
          ${field("aTitle", "Announcement title", `<input id="aTitle" type="text" maxlength="80" value="${esc(a.title)}" ${dis(ae.title,"aTitle")}>`, ae.title)}
          ${field("aMsg", "Short message", `<textarea id="aMsg" rows="3" maxlength="220" ${dis(ae.message,"aMsg")}>${esc(a.message)}</textarea>`, ae.message, `${a.message.length}/160`)}
          <fieldset class="fld"><legend>Visibility</legend><div class="seg two">
            <button type="button" data-avis="1" aria-pressed="${a.visible}">Visible</button><button type="button" data-avis="0" aria-pressed="${!a.visible}">Hidden</button></div>
            <p class="hint">Hidden announcements don't appear on the citizen Home.</p></fieldset>
          <div class="form-actions"><button type="submit" class="btn" id="aSave">Save announcement</button><button type="button" class="btn soft" id="aCancel">Cancel</button>
            <span class="dirty" id="aDirty" ${annDirty() ? "" : "hidden"}>Unsaved changes</span></div>
        </form>
      </section>
    </div>
    <div class="stackcol preview-col">
      <section class="panel" aria-labelledby="dph"><div class="panel-head"><h2 id="dph">Draft preview</h2><span class="sample-chip">Sample data</span></div>
        <p class="small muted" style="margin:-4px 0 10px">Updates as you type. Not saved yet.</p>
        <div id="draftPreview">${draftPreview()}</div></section>
      <section class="panel" aria-labelledby="cph"><div class="panel-head"><h2 id="cph">Citizen Home</h2><span class="sample-chip">Sample data</span></div>
        <p class="small muted" style="margin:-4px 0 10px">What citizens would see with the saved content.</p>
        <div id="homePreview">${citizenHome()}</div></section>
    </div>
  </div>`;
}
function draftPreview(){
  return `<div class="phone draft">${annDraft.visible ? announcementCard(annDraft) : `<div class="c-empty">Announcement hidden</div>`}${missionCard(missionDraft, {draft:true})}</div>`;
}
/* Typing updates the draft and the draft preview without re-rendering the form. */
function refreshDraftUI(){
  const dp = $("#draftPreview"); if(dp) dp.innerHTML = draftPreview();
  const md = $("#mDirty"); if(md) md.hidden = !missionDirty();
  const ad = $("#aDirty"); if(ad) ad.hidden = !annDirty();
}
const MAP_M = {mTitle:"title", mDesc:"desc", mTarget:"target", mBonus:"bonus", mStart:"start", mEnd:"end"}, MAP_A = {aTitle:"title", aMsg:"message"};
document.addEventListener("input", e => {
  if(route().name !== "content") return;
  const id = e.target.id;
  if(MAP_M[id]){ missionDraft[MAP_M[id]] = e.target.value; if(id==="mDesc") e.target.closest(".fld").querySelector(".hint")?.replaceChildren(`${e.target.value.length}/140`); refreshDraftUI(); }
  if(MAP_A[id]){ annDraft[MAP_A[id]] = e.target.value; if(id==="aMsg") e.target.closest(".fld").querySelector(".hint")?.replaceChildren(`${e.target.value.length}/160`); refreshDraftUI(); }
});
document.addEventListener("change", e => {
  if(e.target.id !== "mPick") return;
  /* Switching missions discards unsaved mission edits, as Cancel would. */
  editingId = e.target.value; missionDraft = null; missionErrors = {}; render();
});
document.addEventListener("submit", e => {
  if(e.target.id === "missionForm"){ e.preventDefault();
    const m = {...missionDraft, title: missionDraft.title.trim(), desc: missionDraft.desc.trim()};
    missionErrors = validateMission(m);
    if(Object.keys(missionErrors).length){ render(); document.querySelector("#missionForm [aria-invalid]")?.focus(); toast("Mission not saved. Fix the highlighted fields."); return; }
    const saved = savedMission(), list = S.content.missions;
    const clean = {...m, target: Number(m.target), bonus: Number(m.bonus)};
    if(saved && missionLocked(saved)) Object.assign(saved, {title: clean.title, desc: clean.desc, status: clean.status}); /* locked fields stay as they were */
    else if(saved) Object.assign(saved, clean);
    else list.push(clean);
    save(); editingId = clean.id; missionDraft = null; render(); toast("Mission saved. Citizen preview updated.");
  }
  if(e.target.id === "annForm"){ e.preventDefault();
    const a = {...annDraft, title: annDraft.title.trim(), message: annDraft.message.trim()};
    annErrors = validateAnn(a);
    if(Object.keys(annErrors).length){ render(); document.querySelector("#annForm [aria-invalid]")?.focus(); toast("Announcement not saved. Fix the highlighted fields."); return; }
    S.content.announcement = a; save(); annDraft = null; render(); toast(a.visible ? "Announcement saved. Citizen preview updated." : "Announcement saved and hidden from citizens.");
  }
});
document.addEventListener("click", e => {
  if(route().name !== "content") return;
  const t = e.target.closest("[data-mtype],[data-mstatus],[data-avis],#mCancel,#aCancel,[data-act=nextMission]"); if(!t || t.disabled) return;
  if(t.dataset.mtype){ missionDraft.type = t.dataset.mtype; render(); return; }
  if(t.dataset.mstatus){ missionDraft.status = t.dataset.mstatus; render(); return; }
  if(t.dataset.avis){ annDraft.visible = t.dataset.avis === "1"; render(); return; }
  if(t.id === "mCancel"){ missionDraft = null; missionErrors = {}; if(!savedMission() && !S.content.missions.some(x => x.id===editingId)) editingId = null; render(); toast("Mission edits discarded."); return; }
  if(t.id === "aCancel"){ annDraft = null; annErrors = {}; render(); toast("Announcement edits discarded."); return; }
  if(t.dataset.act === "nextMission"){
    const base = S.content.missions.at(-1), start = isoDay(dayStart(base.end) + DAY), end = isoDay(dayStart(base.end) + 7*DAY);
    missionDraft = {id: "m" + Date.now().toString(36), title: "Next weekly mission", desc: base.desc, type: base.type, target: base.target, start, end, bonus: base.bonus, status: "active", participants: 0, sampleProgress: 0};
    editingId = missionDraft.id; missionErrors = {}; render(); document.getElementById("mTitle")?.focus();
    toast("New mission drafted with its own progress. Save to add it.");
  }
});

/* ---------- Router ---------- */
let current = "";
function route(){ const h = location.hash.slice(1); return /^r\d+$/.test(h) ? {name:"detail", id:"BG-"+h.slice(1)} : h==="reports" ? {name:"reports"} : h==="content" ? {name:"content"} : {name:"overview"}; }
function render(){
  const r = route(), key = r.name + (r.id||"");
  if(r.name !== "content" && current.startsWith("content")){ missionDraft = null; annDraft = null; missionErrors = {}; annErrors = {}; } /* leaving the page discards unsaved edits */
  $("#view").innerHTML = r.name==="detail" ? viewDetail(r.id) : r.name==="reports" ? viewReports() : r.name==="content" ? viewContent() : viewOverview();
  document.querySelectorAll("[data-nav]").forEach(a => { const on = a.dataset.nav === (r.name==="detail" ? "reports" : r.name); if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const pending = stageCounts().pending; $("#navPending").textContent = pending || ""; $("#navPending").hidden = !pending;
  if(key !== current){ current = key; window.scrollTo(0,0); }
  flashKeys = [];
}
window.addEventListener("hashchange", render);
document.addEventListener("click", e => {
  const filt = e.target.closest("[data-filter]");
  if(filt){ listState.filter = filt.dataset.filter; listState.q = ""; if(location.hash !== "#reports") location.hash = "reports"; else render(); return; }
  /* Row click opens the report too, but never when a button or link inside the row was used. */
  const row = e.target.closest("tr[data-href]"); if(row && !e.target.closest("a,button")){ location.hash = row.dataset.href.slice(1); return; }
  const r = route(), id = r.id;
  const rv = e.target.closest("[data-review]"); if(rv && id){ const v = rv.dataset.review, cur = S.reports.find(x=>x.id===id); if(cur.review!==v) change(id, {review:v}, v==="pending" ? "Moved back to pending review" : `Marked ${REVIEW[v]}`); return; }
  const rp = e.target.closest("[data-repair]"); if(rp && id && !rp.disabled){ const v = rp.dataset.repair, cur = S.reports.find(x=>x.id===id); if(cur.review==="accepted" && cur.repair!==v) change(id, {repair:v}, `Repair ${REPAIR[v].toLowerCase()}`); return; }
  const rk = e.target.closest("[data-risk]"); if(rk && id){ const v = rk.dataset.risk === "ai" ? null : rk.dataset.risk; if(S.reports.find(x=>x.id===id).staffRisk!==v) change(id, {staffRisk:v}, v ? `Staff rated risk ${RISK[v]}` : "Returned to the AI assessment"); return; }
  const act = e.target.closest("[data-act]");
  if(act?.dataset.act==="accept"){ change(act.dataset.id, {review:"accepted"}, "Marked Accepted"); return; }
  if(act?.dataset.act==="note"){ const v = $("#note").value.trim(); change(act.dataset.id, {note:v}, v ? "Internal note saved" : "Internal note cleared"); return; }
});
document.addEventListener("input", e => { if(e.target.id==="q"){ listState.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos,pos); } });
document.addEventListener("change", e => { if(e.target.id==="sort"){ listState.sort = e.target.value; render(); } });
$("#resetBtn").onclick = () => { S = {reports: seed(), content: seedContent()}; save(); missionDraft = null; annDraft = null; missionErrors = {}; annErrors = {}; editingId = null; listState = {filter:"all", q:"", sort:"new"}; flashKeys = []; render(); toast("Sample data reset."); };
render();
</script>

</body></html>
